# Serves the Vite build at the ROOT of the block's subdomain.
# GOTCHA #33/#36: the manifest's iframe.src is `https://<blockId>.civit.ai/`
# (root, no path prefix). With Vite `base: '/'`, the bundle requests its
# assets from `/assets/...`, which this config serves directly. Do NOT add a
# `/<slug>/` location or a redirect from `/` — submitVersion rejects a
# manifest whose iframe.src has a non-root pathname.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: every route resolves to index.html so a deep link inside
  # the block doesn't 404. (A single-view block never deep-links, but this is
  # harmless and future-proof.)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The block's own edge CSP. The platform does not (yet) inject one
  # (W11 CSP-1), so set a conservative policy here. `frame-ancestors` must
  # permit civitai.com to embed the iframe.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://civitai.com; frame-ancestors https://civitai.com https://*.civitai.com;" always;
}
