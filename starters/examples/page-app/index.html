<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      DARK FIRST, and the OS preference is never consulted: civitai.com is dark,
      and light engages only when the HOST says so — the URL fragment (the inline
      script below, before first paint), then BLOCK_INIT and THEME_CHANGE (the
      effect in src/App.tsx). `light dark` here would paint a white canvas on a
      light-OS viewer while the host page is dark.
    -->
    <meta name="color-scheme" content="dark light" />
    <title>page-app — Civitai App</title>
    <style>
      /*
        BOOT SKELETON. Paired with `"bootSkeleton": true` in block.manifest.json:
        on the full-page run host that key makes the host stand down its own
        branded overlay, so this markup is the only thing on screen until React
        mounts. Ship the two together. It is shaped like the page (a header bar
        and a grid of cards) and fills the frame, because a page app owns the
        whole viewport rather than sizing to its content.
        Literal colours, because the --civitai-* tokens do not exist yet: they
        are injected by src/main.tsx. Dark is the base; light only behind
        html[data-theme='light'].
      */
      html {
        background: #1a1b1e;
      }
      html[data-theme='light'] {
        background: #ffffff;
      }
      [data-boot-skeleton] {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      [data-boot-skeleton] span {
        display: block;
        border-radius: 6px;
        background: #2c2e33;
      }
      [data-boot-skeleton] > [data-line='title'] {
        height: 22px;
        width: 220px;
        max-width: 60%;
      }
      [data-boot-skeleton] > [data-line='grid'] {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
        gap: 16px;
        background: none;
      }
      [data-boot-skeleton] > [data-line='grid'] > span {
        height: 132px;
      }
      html[data-theme='light'] [data-boot-skeleton] span {
        background: #e9ecef;
      }
      html[data-theme='light'] [data-boot-skeleton] > [data-line='grid'] {
        background: none;
      }
    </style>
    <script>
      /*
        THEME FAST PATH: synchronous, pre-paint. Only the host's own fragment
        (`#civitai-block=v1&theme=…`) counts, and only `theme=light` leaves the
        dark default. BLOCK_INIT stays authoritative: src/App.tsx overwrites this.
        (On civitai.com the host sends the fragment only to allowlisted apps, so
        for most apps this is a no-op and the dark default carries the first
        paint — see the README.)
      */
      (function () {
        try {
          var params = new URLSearchParams(location.hash.slice(1));
          if (params.get('civitai-block') !== 'v1') return;
          document.documentElement.dataset.theme = params.get('theme') === 'light' ? 'light' : 'dark';
        } catch (e) {
          /* a malformed fragment must never block the boot paint */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Inside #root on purpose: React's first render replaces it. -->
      <div data-boot-skeleton aria-hidden="true">
        <span data-line="title"></span>
        <span data-line="grid">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
