version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    ignore:
      # 🔴 These two actions are used ONLY in workflows that have no
      # `pull_request` trigger — `changesets/action` in release.yml (push: main)
      # and `peter-evans/create-pull-request` in revendor-canonical-schema.yml
      # (schedule + workflow_dispatch). So a Dependabot PR bumping either one is
      # GREEN on every PR check, because nothing in `ci.yml` exercises the
      # workflow it lives in. The breakage only appears after merge, on the next
      # push to main (release wedged) or the next scheduled run.
      #
      # This is not hypothetical: `7be170e` ("bump the actions group across 1
      # directory with 3 updates", #175) took create-pull-request from v6.1.0 to
      # v8.1.1 — a MAJOR — and merged, leaving its version comment two majors
      # stale until 2026-08-20. changesets/action v2 is worse than stale: it
      # `throwOnRenamedInputs` for publish/version/commit/title, all four of
      # which release.yml passes, and throws when env.GITHUB_TOKEN is set
      # alongside the github-token input, which release.yml also does.
      #
      # Minor/patch bumps still flow. Majors for these two land via a dedicated
      # PR where a human reads the upstream changelog first — same policy the
      # npm ecosystem below already applies to typescript/vitest/eslint.
      #
      # The other three actions here (checkout, setup-node, pnpm/action-setup)
      # are deliberately NOT listed: they also appear in ci.yml, so a PR's own
      # checks do exercise them.
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
      - dependency-name: 'peter-evans/create-pull-request'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns: ['@types/*']
      eslint:
        patterns: ['eslint*', '@typescript-eslint/*']
      playwright:
        patterns: ['@playwright/*', 'playwright']
      next:
        patterns: ['next', 'eslint-config-next']
      sveltekit:
        patterns: ['@sveltejs/*', 'svelte', 'svelte-check']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vite:
        patterns: ['vite', '@vitejs/*', 'vite-plugin-*', '@hono/vite-dev-server']
      hono:
        patterns: ['hono', '@hono/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*', 'autoprefixer', 'postcss']
    ignore:
      # Major bumps land via dedicated PRs, not Dependabot.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      # eslint v10 removed context.getFilename(); eslint-plugin-react (pulled
      # via eslint-config-next) has no eslint-10-compatible release yet.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
