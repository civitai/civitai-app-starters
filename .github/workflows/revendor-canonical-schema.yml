name: Re-vendor canonical schema

# Scheduled WRITE twin of the check-canonical-schema CI guard: pulls the
# server-published canonical App Block manifest schema, re-vendors the byte-exact
# mirror at packages/civitai-app-sdk/schemas/app-block/v1.json when it drifts, and
# opens a PR. Keeps the mirror in parity without a human noticing the guard went red.
# (JS twin of the civitai/cli automation.)

on:
  schedule:
    # Every 6 hours at :37 past the hour — 00:37, 06:37, 12:37, 18:37 UTC.
    #
    # WHY THIS CADENCE IS LOAD-BEARING, and why it is no longer weekly. This
    # number is not a politeness setting; it IS the bound on how long this
    # repo's CI stays red after a canonical schema change.
    #
    # The chain: `check-canonical-schema.sh` byte-compares the vendored mirror
    # (packages/civitai-app-sdk/schemas/app-block/v1.json) against the schema
    # published LIVE at the canonical URL, with `diff -u`. That publish happens
    # on a civitai `release` cut — an event this repo cannot observe. There is
    # no webhook from civitai, no repository_dispatch, nothing to subscribe to.
    # So the ONLY thing that closes the gap between "the canonical changed" and
    # "the mirror was re-vendored" is this cron firing. Until it does, the guard
    # is red on every PR in this repo and nothing clears it but a human noticing
    # and dispatching this workflow by hand.
    #
    # The concrete case this was raised for: civitai PR #4314 added an optional
    # `repository` property to the canonical manifest schema and merged to
    # civitai `main` on 2026-08-23. dp-prod deploys from `release`, not `main`,
    # so the published schema does not carry it yet and this mirror is still
    # green. It goes red the moment a `main` -> `release` cut publishes the new
    # bytes — and that cut is invisible from here. On the old weekly cron
    # ("37 7 * * 1", Mondays) that was up to SEVEN DAYS of red CI; at 6-hourly
    # it is at most ~6 hours.
    #
    # The minute is deliberately :37 and NOT :00 — GitHub delays cron jobs
    # scheduled on the hour, because everyone schedules on the hour. :37 also
    # keeps this off the minute of the sibling scheduled workflow in this repo
    # (published-starter-smoke :23), so the two never open PRs in the same
    # minute.
    #
    # Cron literal quoted so the `*` isn't parsed as a YAML alias.
    - cron: "37 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '24'

jobs:
  revendor:
    name: Re-vendor + open PR on drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Re-vendor canonical schema
        run: ./scripts/revendor-canonical-schema.sh

      - name: Detect changes
        id: changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Validate the FULL relevant SDK suite (not a subset): schema-parity /
      # defineBlock tests read the vendored schema, so a canonical change that
      # breaks an SDK assertion fails HERE and no PR opens; an additive/optional
      # change passes and the PR opens.
      - name: Validate SDK against the re-vendored schema
        if: steps.changed.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @civitai/app-sdk typecheck
          pnpm --filter @civitai/app-sdk test
          pnpm --filter @civitai/app-sdk build

      - name: Open PR if schema changed
        if: steps.changed.outputs.changed == 'true'
        # SHA-pinned to an EXACT commit, asserted by
        # `tests/guards/workflow-action-pins.test.mjs` (PINNED), which runs in ci.yml's
        # `Starter` job — `pull_request`-triggered and a required context. This
        # workflow runs on schedule + workflow_dispatch only — no `pull_request`
        # trigger — so that assertion is the ONLY thing a bump PR
        # runs against it. Changing this line without updating PINNED turns the PR red.
        #
        # The label lives on the `uses:` line, not above it: `7be170e` bumped this pin
        # v6.1.0 -> v8.1.1 (a major) and left the full-line comment above untouched,
        # which is how it stayed mislabelled until 2026-08-20 (v6.1.0 is c5a7806).
        # ⚠️ That commit shows Dependabot ignores the line ABOVE; it does not show it
        # rewrites a trailing label — the old line had no trailing label to rewrite.
        # Dependabot's trailing-comment rewrite is known-flaky (dependabot-core #7912,
        # #8011, #14716), so treat the label as documentation, not as verified truth.
        # PINNED is what actually holds the sha; keep the two in step by hand.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Reuse CHANGESETS_TOKEN: the org blocks the default GITHUB_TOKEN from
          # opening PRs, and this secret already carries PR-creation perms for the
          # changesets release workflow. A dedicated token would be cleaner if the
          # coupling ever bites, but reusing it avoids adding another secret.
          token: ${{ secrets.CHANGESETS_TOKEN }}
          branch: automation/revendor-canonical-schema
          delete-branch: true
          commit-message: "chore(sdk): re-vendor canonical app-block manifest schema"
          title: "chore(sdk): re-vendor canonical app-block manifest schema"
          body: |
            Automated re-vendor of the App Block manifest schema mirror at
            `packages/civitai-app-sdk/schemas/app-block/v1.json` to restore
            byte-parity with the server-published canonical
            (https://civitai.com/schemas/app-block/v1.json).

            The vendored copy MUST stay byte-identical to the canonical — the
            `check-canonical-schema.sh` CI guard enforces that with `diff -u`.
            This PR was opened because the scheduled re-vendor job (every 6
            hours) detected drift.

            Validated in-job before opening this PR: `@civitai/app-sdk`
            typecheck + test + build all passed against the re-vendored schema
            (the schema-parity / `defineBlock` tests read the vendored bytes, so
            a canonical change that broke an SDK assertion would have failed the
            job and no PR would have opened).

            **Reviewer heads-up:** this bot only re-vendors the schema *bytes*. A
            semantic canonical addition — e.g. a new manifest field like
            `scopeJustifications` (civitai #3195) — may also warrant adding the
            matching field to the `BlockManifestV1` TS type in
            `packages/civitai-app-sdk/src/blocks/types.ts`. Check the diff for
            new/changed fields and follow up with a type change if needed.

            _JS twin of the civitai/cli schema re-vendor automation._
