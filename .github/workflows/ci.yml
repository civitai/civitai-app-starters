name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A manual run with `only: all` (the default) takes no lane: every job runs.
  #
  # `only: <lane>` runs that one lane's steps and skips the rest, so a
  # re-check of one lane does not put every check in the org's shared runner
  # queue. A narrowed run still writes check runs for this commit, so it
  # narrows only when no open pull request has this commit as its head (`lanes`
  # asks the API; an open one or a failed lookup runs every lane), and the
  # partial hosts report as `[only <lane>] Core (all packages)` and
  # `[only <lane>] Starters (all five)`. Selection
  # is decided where every other lane is, in `scripts/ci-lanes.mjs` (lane
  # `only`), and reaches the jobs through the same `lanes` outputs and the same
  # `!= 'false'` conditions; no job condition reads `inputs`. So it fails open
  # like they do: a failed `lanes` runs everything. The `starters` job always
  # starts (it is step-gated, see that job) and runs only its every-lane
  # guards unless `only` is `starter`. The options are pinned against `JOBS` by
  # `tests/guards/ci-lanes-ledger.test.mjs`. On push and pull_request
  # `inputs.only` is empty and nothing changes.
  #
  # There is deliberately NO `schedule:` here. Every push to main runs all five
  # advisory jobs, which is what notices drift nobody's PR caused (push runs
  # landed on 28 of the 31 days 2026-09-12..10-12), and two of them have their own re-sync crons
  # (`revendor-canonical-schema.yml`, `sync-orchestrator-catalogs.yml`).
  #
  # WHERE A RED ADVISORY JOB SHOWS UP NOW, exactly: on main's commit status
  # (the push run is red), and, for schema and catalog drift, as the PR the
  # re-sync workflow above opens. Nothing else: no issue, no notification, and
  # no pull request unless it touches that job's inputs.
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this job (default: all)'
        type: choice
        default: all
        options:
          - all
          - sdk
          - schema-drift
          - starter-pins
          - orchestrator-catalog-drift
          - civitai-sdk
          - blocks-react
          - design-system
          - design-system-cross-browser
          - design-system-drift-guard
          - readme-snippets
          - starter
          - examples
          - packaging
          - public-types
          - agent-runner

# A manual run gets its own group per ref AND `only` value, and a newer one
# with the same pair cancels the older: it no longer queues behind (or
# displaces the pending) push run on main, and two dispatches for different
# jobs do not cancel each other. Push stays grouped by ref WITHOUT
# cancel-in-progress, unchanged on purpose: main's push run is where an
# advisory red shows up (see the trigger comment above), and the push gate in
# `scripts/ci-lanes.mjs` compares each push with the previous tip, so a run
# cancelled mid-flight would leave a main commit with no verdict and could let
# a lockfile change go without the install that seeds the PR cache.
# A dispatch never cancels a pull_request run (different groups). One that is
# cancelled at a pull request's head leaves `cancelled` check runs on that
# commit: replaced when the newer dispatch is at the same commit, otherwise
# left in place. Either way the PR shows a blocking `cancelled`, never a false
# pass, until something re-runs it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', github.ref, inputs.only) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

env:
  NODE_VERSION: '24'

jobs:
  # LANES AND HOSTS. `scripts/ci-lanes.mjs` is the one place that decides which
  # LANES a run needs (a lane is one unit of checking: `sdk`, `examples`,
  # `schema-drift`, ...; `JOBS` in that script) and writes one `lanes` output
  # per lane. The lanes RUN inside a few HOST jobs (`HOSTS` in the same
  # script), each lane as a set of named steps, so a red step still names the
  # lane that failed:
  #
  #   core       every core lane but `starter`, after ONE install and ONE build
  #              of every package (they each paid their own before)
  #   starters   the `starter` lane: all five starters, after one install and
  #              build; plus the every-lane guards, which run in EVERY lane
  #   advisory   four of the five advisory lanes (the live drift checks)
  #   design-system-cross-browser
  #              the fifth advisory lane, alone because it runs in a container
  #
  # Before this layout every lane was its own job: 16 runner slots on a
  # full-lane pull request run and 20 on a push to main, against an org-wide
  # cap on concurrent hosted jobs. Now it is 4 and 5.
  #
  # 🔴 THE SHAPE OF THE CONDITIONS IS THE FAIL-OPEN GUARANTEE; do not "tidy" it.
  #   - A host job's `if:` is `!cancelled()` AND-ed with its lanes'
  #     `!= 'false'` clauses OR-ed together; a step's `if:` is `!cancelled()`
  #     AND-ed with its ONE lane's clause (and optionally more conjuncts).
  #   - `!cancelled()` is a status function, and a status function is what stops
  #     GitHub applying the implicit `success()` that would SKIP every dependent
  #     the moment `lanes` failed or was skipped (and, on a step, every later
  #     lane the moment an earlier lane's step failed). Without it, a broken
  #     classifier turns the whole workflow green-by-skipping, required
  #     contexts included.
  #   - `!= 'false'` and never `== 'true'`: something is skipped only when the
  #     script positively wrote `false` for it. A failed or skipped `lanes` has
  #     EMPTY outputs, and empty is not `false`, so everything runs.
  #
  # Selection is job- and step-level on purpose. A job skipped by its own `if:`
  # reports `skipped`, which satisfies a required context; a workflow-level
  # `paths:` filter leaves required contexts pending forever.
  #
  # The lanes themselves (`full`, `only`, `release` for a Version Packages PR
  # that is only a version bump, and `tree-already-tested` for a push to main
  # whose exact tree a full-lane PR run already passed; see `record-tree` at the
  # bottom) are defined in the script's header.
  #
  # REQUIRED CONTEXTS on `main` are the two hosts that carry verdicts for
  # pull requests: `Core (all packages)` and `Starters (all five)`. Both names
  # are expressions fed by the `name-prefix` output, which is '' everywhere but
  # a dispatch narrowed by `only`; there the partial run reports as
  # `[only <lane>] Core (all packages)` and cannot satisfy a required context.
  # GitHub never evaluates a SKIPPED job's `name:` expression, so a host that
  # carries one must never be skipped in a pull_request lane: `starters` is
  # never skipped at all, and `core` always has a lane on in the full and
  # release lanes. `tests/guards/ci-lanes-ledger.test.mjs` pins all of this
  # against the ledger.
  #
  # `lanes` is NOT a required context, and it must not become one: nothing
  # depends on it succeeding.
  lanes:
    name: CI lanes (which jobs this run needs)
    runs-on: ubuntu-latest
    # A checkout and a few API calls. A hang here holds every other job, and a
    # timed-out `lanes` fails open (empty outputs: everything runs).
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # The push gate reads artifact listings, runs and their jobs.
      actions: read
    outputs:
      lane: ${{ steps.decide.outputs.lane }}
      sdk: ${{ steps.decide.outputs.sdk }}
      schema-drift: ${{ steps.decide.outputs.schema-drift }}
      starter-pins: ${{ steps.decide.outputs.starter-pins }}
      orchestrator-catalog-drift: ${{ steps.decide.outputs.orchestrator-catalog-drift }}
      civitai-sdk: ${{ steps.decide.outputs.civitai-sdk }}
      blocks-react: ${{ steps.decide.outputs.blocks-react }}
      design-system: ${{ steps.decide.outputs.design-system }}
      design-system-cross-browser: ${{ steps.decide.outputs.design-system-cross-browser }}
      design-system-drift-guard: ${{ steps.decide.outputs.design-system-drift-guard }}
      readme-snippets: ${{ steps.decide.outputs.readme-snippets }}
      starter: ${{ steps.decide.outputs.starter }}
      examples: ${{ steps.decide.outputs.examples }}
      packaging: ${{ steps.decide.outputs.packaging }}
      public-types: ${{ steps.decide.outputs.public-types }}
      agent-runner: ${{ steps.decide.outputs.agent-runner }}
      # '' except in a narrowed dispatch; read by the Starter job's `name:`.
      name-prefix: ${{ steps.decide.outputs.name-prefix }}
    steps:
      - uses: actions/checkout@v7

      # The runner's preinstalled node is enough (built-ins only), which keeps
      # this job, and so the start of every job behind it, to a few seconds.
      - id: decide
        run: node scripts/ci-lanes.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ── CORE ────────────────────────────────────────────────────────────────────
  # Every core lane except `starter`: one install, one build of every package,
  # then each lane's checks as steps named `<lane>: ...`. A REQUIRED context.
  #
  # The setup steps (checkout, pnpm, node, install, the package build) run
  # whenever the job runs; every other step belongs to exactly one lane and
  # carries that lane's condition, which is what lets the release lane (only
  # `packaging`) and a narrowed dispatch run part of this job.
  #
  # Self-contained: no civitai/civitai checkout and no live external
  # dependency beyond the package registry, so it is safe as a required check.
  # The live-dependent checks are in `advisory` below.
  core:
    name: ${{ format('{0}Core (all packages)', needs.lanes.outputs.name-prefix) }}
    needs: lanes
    if: ${{ !cancelled() && (needs.lanes.outputs.sdk != 'false' || needs.lanes.outputs.civitai-sdk != 'false' || needs.lanes.outputs.blocks-react != 'false' || needs.lanes.outputs.design-system != 'false' || needs.lanes.outputs.readme-snippets != 'false' || needs.lanes.outputs.examples != 'false' || needs.lanes.outputs.packaging != 'false' || needs.lanes.outputs.public-types != 'false' || needs.lanes.outputs.agent-runner != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The sum of what the nine jobs this replaces measured at p50 was about 8
    # minutes, most of it nine installs and builds that now happen once.
    timeout-minutes: 45
    # agent-runner: replies run as DBOS workflows, and the golden test reads
    # back, from DBOS's own tables, the calls a reply makes. That suite FAILS in
    # CI without the database URL on its step (it skips only outside CI), so a
    # lost service cannot turn into a silent skip. Postgres 18, as the civitai
    # service this package was moved out of tests on.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      # Pinned, and asserted by the checker, so a CLI release cannot change the
      # examples lane's verdict without a reviewed bump here.
      CIVITAI_CLI_VERSION: '0.1.113'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 🔴 BEFORE THE BUILD, AND THAT ORDER IS THE WHOLE POINT. The build below
      # regenerates `packages/civitai-components/src/version.generated.ts` from
      # package.json (`@civitai/blocks-react` and `@civitai/sdk` commit one too,
      # and this step checks all three), so by the time `@civitai/components
      # test` runs its own parity assertion the two sides agree by construction
      # and it cannot fail. That is how 0.8.1 stayed committed against a 0.9.0
      # package.json from #492 onward with CI green throughout. This step reads
      # the COMMITTED file as text and is the only thing here that can see that
      # drift. Moving it below the build silently disarms it. Self-test:
      # `pnpm check:generated-version:selftest`.
      - name: 'design-system: committed version.generated.ts matches package.json'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm check:generated-version

      # Every package, in dependency order (pnpm -r is topological). Each lane
      # used to build its own subset; all of them are in this one.
      - run: pnpm -r --filter "./packages/*" build
        if: ${{ !cancelled() }}

      # ── sdk ──
      - name: 'sdk: typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.sdk != 'false' }}
        run: pnpm --filter @civitai/app-sdk typecheck
      - name: 'sdk: test'
        if: ${{ !cancelled() && needs.lanes.outputs.sdk != 'false' }}
        run: pnpm --filter @civitai/app-sdk test
      # The vitest suite imports `src/`; every consumer imports the PUBLISHED
      # specifier (`@civitai/app-sdk/vite`). This resolves the node-only
      # subpaths BY PACKAGE NAME against the built `dist/` and runs
      # `defineBlock` once, which proves the vendored schema ships.
      - name: 'sdk: published exports resolve'
        if: ${{ !cancelled() && needs.lanes.outputs.sdk != 'false' }}
        run: pnpm --filter @civitai/app-sdk test:exports

      # ── civitai-sdk ──
      - name: 'civitai-sdk: typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.civitai-sdk != 'false' }}
        run: pnpm --filter @civitai/sdk typecheck
      - name: 'civitai-sdk: api:check'
        if: ${{ !cancelled() && needs.lanes.outputs.civitai-sdk != 'false' }}
        run: pnpm --filter @civitai/sdk api:check
      - name: 'civitai-sdk: check:layering'
        if: ${{ !cancelled() && needs.lanes.outputs.civitai-sdk != 'false' }}
        run: pnpm --filter @civitai/sdk check:layering
      - name: 'civitai-sdk: check:parity'
        if: ${{ !cancelled() && needs.lanes.outputs.civitai-sdk != 'false' }}
        run: pnpm --filter @civitai/sdk check:parity
      - name: 'civitai-sdk: check:steps'
        if: ${{ !cancelled() && needs.lanes.outputs.civitai-sdk != 'false' }}
        run: pnpm --filter @civitai/sdk check:steps
      - name: 'civitai-sdk: check:host-replies'
        if: ${{ !cancelled() && needs.lanes.outputs.civitai-sdk != 'false' }}
        run: pnpm --filter @civitai/sdk check:host-replies
      - name: 'civitai-sdk: test'
        if: ${{ !cancelled() && needs.lanes.outputs.civitai-sdk != 'false' }}
        run: pnpm --filter @civitai/sdk test

      # ── blocks-react ──
      - name: 'blocks-react: typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.blocks-react != 'false' }}
        run: pnpm --filter @civitai/blocks-react typecheck
      - name: 'blocks-react: test'
        if: ${{ !cancelled() && needs.lanes.outputs.blocks-react != 'false' }}
        run: pnpm --filter @civitai/blocks-react test
      # Real-browser (vitest browser mode) perf/layout tests for the dev:live
      # picker overlay. CI uses Playwright's bundled Chromium (NixOS local runs
      # set PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)).
      #
      # 🔴 NO `--with-deps`, AND THAT IS THE FIX RATHER THAN AN OMISSION. That
      # flag runs apt-get, and the runner's package mirror was where every slow
      # or timed-out install hung; the browser download itself is fast. On
      # `ubuntu-latest` it NEWLY installed no shared library for chromium, only
      # fonts, and it UPGRADED libraries already on the image (libx11,
      # mesa/libgbm, libfreetype6). A chromium crash inside one of those should
      # suspect this first. A MISSING LIBRARY FAILS RED, NOT GREEN: nothing in
      # the browser suites skips when the browser cannot launch. The remedy is
      # to install that one package, not `--with-deps`.
      #
      # Each lane that needs Chromium installs it in its own step, so a narrowed
      # run of that lane alone still has it; after the first, the install finds
      # the shared Playwright cache and returns in seconds. Every one is the
      # same line for the same reason. 5 minutes: worst seen 86 s.
      - name: 'blocks-react: install Chromium'
        if: ${{ !cancelled() && needs.lanes.outputs.blocks-react != 'false' }}
        run: pnpm --filter @civitai/blocks-react exec playwright install chromium
        timeout-minutes: 5
      - name: 'blocks-react: browser tests'
        if: ${{ !cancelled() && needs.lanes.outputs.blocks-react != 'false' }}
        run: pnpm --filter @civitai/blocks-react test:browser

      # ── design-system (theme + components + components-react + components-chat) ──
      # @civitai/theme: the SELF-CONTAINED guards only (generation parity and
      # the breakpoint px-not-em scale guard). The live-civitai drift guards run
      # in the advisory `design-system-drift-guard` lane.
      - name: 'design-system: theme typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/theme typecheck
      - name: 'design-system: theme self-contained tests'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/theme test:self
      - name: 'design-system: components typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/components typecheck
      - name: 'design-system: components test'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/components test
      - name: 'design-system: components-react typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/components-react typecheck
      - name: 'design-system: components-react test'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/components-react test
      # <civitai-chat>: logic in node, the elements in jsdom.
      - name: 'design-system: components-chat typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/components-chat typecheck
      - name: 'design-system: components-chat test'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/components-chat test
      - name: 'design-system: install Chromium'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/components-react exec playwright install chromium
        timeout-minutes: 5
      # The React BINDING MECHANICS in real Chromium: property assignment,
      # refs, typed custom events, shadow-root `change` retargeting.
      - name: 'design-system: components-react browser tests'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/components-react test:browser
      # The custom elements: real upgrade, ElementInternals and computed styles,
      # including parity against the attribute markup they replace.
      - name: 'design-system: components browser tests'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/components test:browser
      # <civitai-chat> layout in real Chromium: it must fit a phone-width host.
      - name: 'design-system: components-chat browser tests'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system != 'false' }}
        run: pnpm --filter @civitai/components-chat test:browser

      # ── readme-snippets ──
      # Resolves documented imports against the packages' BUILT declarations.
      - name: 'readme-snippets: typecheck README code'
        if: ${{ !cancelled() && needs.lanes.outputs.readme-snippets != 'false' }}
        run: pnpm typecheck:readme
      # Negative controls for the step above: the runner can go RED, and it
      # prints what it still does not cover.
      - name: 'readme-snippets: selftest'
        if: ${{ !cancelled() && needs.lanes.outputs.readme-snippets != 'false' }}
        run: pnpm typecheck:readme:selftest

      # ── examples (`starters/examples/*`) ──
      # Every example built, typechecked and validated with the CLI the docs
      # tell people to run on a copied-out example. `civitai app validate` is
      # static; no live Civitai endpoint is contacted.
      - name: 'examples: typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.examples != 'false' }}
        run: pnpm -r --filter "./starters/examples/*" typecheck
      # `vite build` also runs blockManifestPlugin (`defineBlock` against the
      # vendored canonical schema) on every example manifest.
      - name: 'examples: build'
        if: ${{ !cancelled() && needs.lanes.outputs.examples != 'false' }}
        run: pnpm -r --filter "./starters/examples/*" build
      - name: 'examples: install the civitai CLI (pinned)'
        if: ${{ !cancelled() && needs.lanes.outputs.examples != 'false' }}
        run: npm install -g "@civitai/cli@${CIVITAI_CLI_VERSION}"
      # NEGATIVE + POSITIVE control FIRST: a clean copy must validate clean and
      # the same copy without its lockfile must not.
      - name: 'examples: validate selftest'
        if: ${{ !cancelled() && needs.lanes.outputs.examples != 'false' }}
        run: pnpm check:examples-validate:selftest
        env:
          EXPECTED_CLI_VERSION: ${{ env.CIVITAI_CLI_VERSION }}
      # `--strict`, in place AND on a copy of only the tracked files (what
      # `npx tiged` delivers). See the script for the one allowlisted warning.
      - name: 'examples: civitai app validate'
        if: ${{ !cancelled() && needs.lanes.outputs.examples != 'false' }}
        run: pnpm check:examples-validate
        env:
          EXPECTED_CLI_VERSION: ${{ env.CIVITAI_CLI_VERSION }}
      - name: 'examples: install Chromium'
        if: ${{ !cancelled() && needs.lanes.outputs.examples != 'false' }}
        run: pnpm --filter @civitai/blocks-react exec playwright install chromium
        timeout-minutes: 5
      # BEHAVIOUR, not compilation: each example boots under `dev:harness` in
      # headless Chromium, renders past "Loading…", logs no error, and PAINTS
      # the host's theme.
      - name: 'examples: render in Chromium'
        if: ${{ !cancelled() && needs.lanes.outputs.examples != 'false' }}
        run: pnpm check:examples-render
        timeout-minutes: 5

      # ── packaging: what the TARBALLS contain ──
      # Every other lane resolves `src/` or the workspace link; this looks at
      # the artifact npm receives (#376: 270 sourcemaps that resolved nothing).
      # NEGATIVE + POSITIVE control first, so the check cannot report a
      # reassuring zero from a checker wired to nothing.
      - name: 'packaging: shipped sourcemaps selftest'
        if: ${{ !cancelled() && needs.lanes.outputs.packaging != 'false' }}
        run: pnpm check:shipped-sourcemaps:selftest
      - name: 'packaging: shipped sourcemaps'
        if: ${{ !cancelled() && needs.lanes.outputs.packaging != 'false' }}
        run: pnpm check:shipped-sourcemaps

      # ── public-types: what a CONSUMER can name (#379) ──
      # The checker's own unit tests need the installed `typescript`, so the
      # every-lane `pnpm test:guards` (before any install, in `starters`) skips
      # them; here GUARDS_REQUIRE_INSTALL turns that skip into a failure. They
      # drive temp-dir fixtures, so a red here is the guard's logic.
      - name: 'public-types: checker unit tests'
        if: ${{ !cancelled() && needs.lanes.outputs.public-types != 'false' }}
        run: pnpm test:guards:public-types
        env:
          GUARDS_REQUIRE_INSTALL: '1'
      - name: 'public-types: selftest'
        if: ${{ !cancelled() && needs.lanes.outputs.public-types != 'false' }}
        run: pnpm check:public-types:selftest
      - name: 'public-types: built .d.ts closure'
        if: ${{ !cancelled() && needs.lanes.outputs.public-types != 'false' }}
        run: pnpm check:public-types

      # ── agent-runner (the durable runner behind <civitai-chat>'s remote mode) ──
      - name: 'agent-runner: typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.agent-runner != 'false' }}
        run: pnpm --filter @civitai/agent-runner typecheck
      - name: 'agent-runner: test (with Postgres)'
        if: ${{ !cancelled() && needs.lanes.outputs.agent-runner != 'false' }}
        run: pnpm --filter @civitai/agent-runner test
        env:
          ASSISTANT_RUNNER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # ── STARTERS ────────────────────────────────────────────────────────────────
  # The five starters in ONE job: one install and one package build, then each
  # starter's steps, named `<starter>: ...`. A REQUIRED context.
  #
  # 🔴 THIS JOB IS GATED PER STEP, NOT PER JOB, AND THAT IS LOAD-BEARING. It
  # runs `pnpm test:guards`, which must run on every event and in every lane
  # (`workflow-action-pins.test.mjs` pins that), so every run starts it and
  # runs the guards and the override and generated-version checks; the
  # `starter` lane output turns off the install and everything after it. The
  # job-level `if:` is ONLY the status function: without it a failed or
  # skipped `lanes` job would skip this one, guards included.
  starters:
    name: ${{ format('{0}Starters (all five)', needs.lanes.outputs.name-prefix) }}
    needs: lanes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Unit tests for every guard (node:test; no install, no network). They
      # live in this REQUIRED job on purpose: it is the only required context
      # that runs before the install, so the guards' own coverage is enforced.
      # Call the npm script, not a bare `node --test`: it carries
      # `--test-timeout`, so a guard that hangs fails instead of burning the job.
      - run: pnpm test:guards

      # RELEASE-DEADLOCK GUARD, before the install so a missing override fails
      # with the actionable message instead of ERR_PNPM_OUTDATED_LOCKFILE. The
      # starters pin PUBLISHED caret ranges (they are copied out verbatim by
      # `npx tiged`, see 2a453e6); `changeset version` rewrites those to
      # versions not published yet, so every first-party @civitai/* package must
      # also be pinned to workspace:* in the root pnpm.overrides, or the
      # Version Packages PR can never install. Offline.
      - run: node scripts/check-starter-workspace-overrides.mjs
        if: ${{ !cancelled() }}

      # THE COMMITTED `version.generated.ts` AGAINST ITS package.json, IN EVERY
      # LANE. `core` runs the same check before its build, but the release lane
      # turns that step off, and the release PR is exactly where this drifts.
      # Reads text; must stay ahead of any build step in this job.
      - run: node scripts/check-generated-version.mjs
        if: ${{ !cancelled() }}

      - name: 'starter: install'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm install --frozen-lockfile

      # Starters consume the first-party packages via published caret ranges
      # that the root pnpm.overrides redirects to workspace:*, so every package
      # is built first and each starter typechecks against fresh .d.ts files.
      - name: 'starter: build every package'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm -r --filter "./packages/*" build

      # ── next-app ──
      - name: 'next-app: typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm --filter ./starters/next-app typecheck
      # Each starter's env helper bails on missing CIVITAI_CLIENT_ID etc.; CI has
      # no real secrets, and SKIP_ENV_VALIDATION verifies the code compiles.
      - name: 'next-app: build'
        id: build-next-app
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm --filter ./starters/next-app build
        env:
          SKIP_ENV_VALIDATION: '1'
      # EXPIRED-SESSION PROBE. Next.js forbids cookie writes in a Server
      # Component, a rule that exists only inside a real render. This drives a
      # real `next start` over HTTP and asserts BOTH arms: a rejected refresh
      # clears the cookie and renders logged-out, an accepted one re-seals it
      # and renders signed-in. PROBE_SKIP_BUILD reuses the build above; the
      # timeout is because a wedged child looks exactly like a slow one.
      - name: 'next-app: expired-session probe'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' && steps.build-next-app.outcome == 'success' }}
        run: pnpm --filter ./starters/next-app probe:expired-session
        env:
          PROBE_SKIP_BUILD: '1'
        timeout-minutes: 5
      # Keyed on the script's existence, not on a starter name, so a rename
      # cannot silently stop it.
      - name: 'next-app: test (if defined)'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: |
          if pnpm --filter ./starters/next-app exec node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/next-app test
          else
            echo "No test script for next-app, skipping."
          fi
      - name: 'next-app: lint (if defined)'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: |
          if pnpm --filter ./starters/next-app exec node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/next-app lint
          else
            echo "No lint script for next-app, skipping."
          fi

      # ── sveltekit-app ──
      - name: 'sveltekit-app: typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm --filter ./starters/sveltekit-app typecheck
      # Each starter's env helper bails on missing CIVITAI_CLIENT_ID etc.; CI has
      # no real secrets, and SKIP_ENV_VALIDATION verifies the code compiles.
      - name: 'sveltekit-app: build'
        id: build-sveltekit-app
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm --filter ./starters/sveltekit-app build
        env:
          SKIP_ENV_VALIDATION: '1'
      # Keyed on the script's existence, not on a starter name, so a rename
      # cannot silently stop it.
      - name: 'sveltekit-app: test (if defined)'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: |
          if pnpm --filter ./starters/sveltekit-app exec node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/sveltekit-app test
          else
            echo "No test script for sveltekit-app, skipping."
          fi
      - name: 'sveltekit-app: lint (if defined)'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: |
          if pnpm --filter ./starters/sveltekit-app exec node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/sveltekit-app lint
          else
            echo "No lint script for sveltekit-app, skipping."
          fi

      # ── react-pwa ──
      - name: 'react-pwa: typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm --filter ./starters/react-pwa typecheck
      # Each starter's env helper bails on missing CIVITAI_CLIENT_ID etc.; CI has
      # no real secrets, and SKIP_ENV_VALIDATION verifies the code compiles.
      - name: 'react-pwa: build'
        id: build-react-pwa
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm --filter ./starters/react-pwa build
        env:
          SKIP_ENV_VALIDATION: '1'
      # STATIC-SERVING PROBE. The prod entry once resolved `./dist` against the
      # PROCESS CWD and served the SPA fallback by fetching ITSELF: started from
      # another directory, `/index.html` recursed without bound (25 requests
      # took the process from 20 open descriptors to 92,124). The probe starts
      # the built server from a temp directory and asserts a real asset comes
      # back byte-identical, a burst does not double the socket count, and a
      # missing dist/index.html exits non-zero.
      - name: 'react-pwa: static-serving probe'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' && steps.build-react-pwa.outcome == 'success' }}
        run: pnpm --filter ./starters/react-pwa probe:static-serving
        env:
          PROBE_SKIP_BUILD: '1'
        timeout-minutes: 5
      # COOKIE-FLAGS PROBE. `production` derives from APP_URL's scheme (nothing
      # sets NODE_ENV under `pnpm start`). Drives the real OAuth handshake
      # against a stand-in hub at BOTH points: https -> Secure + HSTS, http ->
      # neither. One point alone is passed by `const production = true`.
      - name: 'react-pwa: cookie-flags probe'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' && steps.build-react-pwa.outcome == 'success' }}
        run: pnpm --filter ./starters/react-pwa probe:cookie-flags
        env:
          PROBE_SKIP_BUILD: '1'
        timeout-minutes: 5
      # Keyed on the script's existence, not on a starter name, so a rename
      # cannot silently stop it.
      - name: 'react-pwa: test (if defined)'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: |
          if pnpm --filter ./starters/react-pwa exec node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/react-pwa test
          else
            echo "No test script for react-pwa, skipping."
          fi
      - name: 'react-pwa: lint (if defined)'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: |
          if pnpm --filter ./starters/react-pwa exec node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/react-pwa lint
          else
            echo "No lint script for react-pwa, skipping."
          fi

      # ── svelte-pwa ──
      - name: 'svelte-pwa: typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm --filter ./starters/svelte-pwa typecheck
      # Each starter's env helper bails on missing CIVITAI_CLIENT_ID etc.; CI has
      # no real secrets, and SKIP_ENV_VALIDATION verifies the code compiles.
      - name: 'svelte-pwa: build'
        id: build-svelte-pwa
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm --filter ./starters/svelte-pwa build
        env:
          SKIP_ENV_VALIDATION: '1'
      # STATIC-SERVING PROBE. The prod entry once resolved `./dist` against the
      # PROCESS CWD and served the SPA fallback by fetching ITSELF: started from
      # another directory, `/index.html` recursed without bound (25 requests
      # took the process from 20 open descriptors to 92,124). The probe starts
      # the built server from a temp directory and asserts a real asset comes
      # back byte-identical, a burst does not double the socket count, and a
      # missing dist/index.html exits non-zero.
      - name: 'svelte-pwa: static-serving probe'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' && steps.build-svelte-pwa.outcome == 'success' }}
        run: pnpm --filter ./starters/svelte-pwa probe:static-serving
        env:
          PROBE_SKIP_BUILD: '1'
        timeout-minutes: 5
      # COOKIE-FLAGS PROBE. `production` derives from APP_URL's scheme (nothing
      # sets NODE_ENV under `pnpm start`). Drives the real OAuth handshake
      # against a stand-in hub at BOTH points: https -> Secure + HSTS, http ->
      # neither. One point alone is passed by `const production = true`.
      - name: 'svelte-pwa: cookie-flags probe'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' && steps.build-svelte-pwa.outcome == 'success' }}
        run: pnpm --filter ./starters/svelte-pwa probe:cookie-flags
        env:
          PROBE_SKIP_BUILD: '1'
        timeout-minutes: 5
      # Keyed on the script's existence, not on a starter name, so a rename
      # cannot silently stop it.
      - name: 'svelte-pwa: test (if defined)'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: |
          if pnpm --filter ./starters/svelte-pwa exec node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/svelte-pwa test
          else
            echo "No test script for svelte-pwa, skipping."
          fi
      - name: 'svelte-pwa: lint (if defined)'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: |
          if pnpm --filter ./starters/svelte-pwa exec node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/svelte-pwa lint
          else
            echo "No lint script for svelte-pwa, skipping."
          fi

      # ── civitai-block-starter ──
      - name: 'civitai-block-starter: typecheck'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm --filter ./starters/civitai-block-starter typecheck
      # Each starter's env helper bails on missing CIVITAI_CLIENT_ID etc.; CI has
      # no real secrets, and SKIP_ENV_VALIDATION verifies the code compiles.
      - name: 'civitai-block-starter: build'
        id: build-civitai-block-starter
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: pnpm --filter ./starters/civitai-block-starter build
        env:
          SKIP_ENV_VALIDATION: '1'
      # Keyed on the script's existence, not on a starter name, so a rename
      # cannot silently stop it.
      - name: 'civitai-block-starter: test (if defined)'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: |
          if pnpm --filter ./starters/civitai-block-starter exec node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/civitai-block-starter test
          else
            echo "No test script for civitai-block-starter, skipping."
          fi
      - name: 'civitai-block-starter: lint (if defined)'
        if: ${{ !cancelled() && needs.lanes.outputs.starter != 'false' }}
        run: |
          if pnpm --filter ./starters/civitai-block-starter exec node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/civitai-block-starter lint
          else
            echo "No lint script for civitai-block-starter, skipping."
          fi
  # ── ADVISORY ────────────────────────────────────────────────────────────────
  # Four of the five ADVISORY lanes: each depends on something outside this
  # tree at run time, so it can fail for reasons outside the PR. On a pull
  # request a lane runs only when the diff touches its inputs (`RULES` in
  # scripts/ci-lanes.mjs); every push to main runs all of them. Do NOT add this
  # job to branch protection.
  advisory:
    name: Advisory (live drift checks)
    needs: lanes
    if: ${{ !cancelled() && (needs.lanes.outputs.schema-drift != 'false' || needs.lanes.outputs.starter-pins != 'false' || needs.lanes.outputs.orchestrator-catalog-drift != 'false' || needs.lanes.outputs.design-system-drift-guard != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # ── schema-drift ──
      # The vendored manifest schema MUST stay byte-identical to the
      # server-published canonical (shared by the platform validator and the
      # `civitai` CLI). A non-200 fails: the canonical is expected live.
      - name: 'schema-drift: canonical manifest schema'
        if: ${{ !cancelled() && needs.lanes.outputs.schema-drift != 'false' }}
        run: ./scripts/check-canonical-schema.sh
      # The document-store contract @civitai/sdk vendors, byte-diffed the same
      # way. `revendor-canonical-schema.yml` re-vendors both on drift.
      - name: 'schema-drift: storage contract'
        if: ${{ !cancelled() && needs.lanes.outputs.schema-drift != 'false' }}
        run: ./scripts/check-storage-contract.sh

      # ── starter-pins ──
      # Every starter/template @civitai/* pin still admits the published npm
      # version (a 0.x caret locks the minor). Fetch + compare, no install; it
      # skips gracefully if npm is unreachable.
      - name: 'starter-pins: pins vs published'
        if: ${{ !cancelled() && needs.lanes.outputs.starter-pins != 'false' }}
        run: node scripts/check-starter-pins.mjs

      # ── orchestrator-catalog-drift ──
      # The SDK's WORKFLOW_STEP_TYPES / IMAGE_GEN_ENGINES catalogs mirror the
      # orchestrator's public OpenAPI spec. The SDK test pins them to a
      # transcribed fixture offline; this pins the fixture to the live spec.
      - name: 'orchestrator-catalog-drift: fixture vs live spec'
        if: ${{ !cancelled() && needs.lanes.outputs.orchestrator-catalog-drift != 'false' }}
        run: node scripts/check-orchestrator-catalogs.mjs

      # ── design-system-drift-guard ──
      # civitai/civitai's vendored sources (public repo, SPARSE):
      #   src/providers  ThemeProvider.tsx, guarded by theme-drift.test.ts
      #   src/utils      breakpoints.json, guarded by breakpoint-drift.test.ts
      # REQUIRE_DRIFT_GUARD=1 turns an absent or unreadable source into a
      # FAILURE, so this can't silently regress to a skip.
      - name: 'design-system-drift-guard: check out civitai/civitai (sparse)'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system-drift-guard != 'false' }}
        uses: actions/checkout@v7
        with:
          repository: civitai/civitai
          ref: main
          path: .civitai-src
          sparse-checkout: |
            src/providers
            src/utils
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: 'design-system-drift-guard: install'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system-drift-guard != 'false' }}
        run: pnpm install --frozen-lockfile
      - name: 'design-system-drift-guard: build theme'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system-drift-guard != 'false' }}
        run: pnpm --filter @civitai/theme build
      - name: 'design-system-drift-guard: theme and breakpoints vs live civitai/civitai'
        if: ${{ !cancelled() && needs.lanes.outputs.design-system-drift-guard != 'false' }}
        run: pnpm --filter @civitai/theme test:drift
        env:
          CIVITAI_REPO: ${{ github.workspace }}/.civitai-src
          REQUIRE_DRIFT_GUARD: '1'

  # ADVISORY cross-engine contract. The chromium half of this contract already
  # runs inside the REQUIRED `core` job (lane `design-system`), so nothing is only checked
  # here.
  #
  # 🔴 IT RUNS IN THE PLAYWRIGHT IMAGE, BECAUSE WEBKIT CANNOT DO WITHOUT APT ON
  # THE RUNNER AND APT IS WHAT WEDGED. Measured, per engine, on `ubuntu-latest`
  # with a plain `playwright install` (no `--with-deps`): chromium and firefox
  # launch and pass; webkit dies at launch on 35 missing libraries (libgtk-4,
  # the gstreamer set, libavif, libflite, …). `--with-deps` for three engines
  # was 181 packages / 126 MB from the runner's apt mirror — this job's install
  # step timed out at 25 minutes three times in ten days, and once took 24m31s
  # and passed (`Fetched 126 MB in 23min 58s (87.4 kB/s)`).
  #
  # The image carries all three engines AND their system libraries, so this job
  # has no install step at all: one registry pull replaces apt and the three
  # CDN downloads.
  #
  # 🔴 THE TAG IS THE ONE HAND-WRITTEN PLAYWRIGHT VERSION IN THIS FILE. The
  # image's browsers only launch under the Playwright that image was built
  # for, and the package comes from pnpm-lock.yaml — a mismatch fails every
  # launch with `Executable doesn't exist at /ms-playwright/…`.
  # A playwright bump (Dependabot opens them) therefore needs the tag below
  # edited by hand; THIS JOB GOING RED on the bump PR is the signal. Nothing
  # else gates it, deliberately: a guard in the required jobs would turn every
  # such bump red until the edit, for an advisory job that already says so.
  #
  # `--user 1001` is the runner's own uid: firefox refuses to start when $HOME
  # is not owned by the user running it, and the image's default is root.
  #
  # Still OUT of branch protection: the pull is a network fetch like any other.
  # It has no step to put a timeout on (it happens in the runner's own
  # `Initialize containers`), hence the JOB-level cap.
  design-system-cross-browser:
    name: design-system cross-browser contract (advisory)
    needs: lanes
    if: ${{ !cancelled() && needs.lanes.outputs.design-system-cross-browser != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    container:
      # Must equal the `playwright` version in pnpm-lock.yaml — see above.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No pnpm store cache in this job, unlike every other one. Inside the
      # container the store sits under a different $HOME, so the cache entry
      # the other jobs share never matches here: this job would keep a second
      # copy of the store under the same key, and pay to save it (37s, measured,
      # with the gzip the image falls back to) each time the lockfile moves.
      # A cold `pnpm install` here was measured at 8s.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @civitai/theme build
      - run: pnpm --filter @civitai/sdk build
      - run: pnpm --filter @civitai/components build

      # Probes the platform features the elements are built on, then the
      # cross-engine surface itself: upgrade, token inheritance across the
      # shadow boundary, form association, `change` escaping, and `::part`.
      - run: pnpm --filter @civitai/components test:contract

  # THE TESTED-TREE RECORD, read by the push gate in `scripts/ci-lanes.mjs`.
  #
  # On a pull_request run that took the FULL lane and in which every CORE lane
  # ran its full step set and its host job succeeded, upload a marker named for
  # the tested MERGE commit's tree. A push to main whose commit has that exact
  # tree then skips its core lanes (the advisory five still run there).
  #
  # 🔴 THE CONDITION NAMES EVERY HOST AND EVERY CORE LANE, ONE BY ONE, AND THAT IS
  # THE ONLY SHAPE
  # THAT WORKS. `success()` is false whenever any needed job was SKIPPED, and
  # the lanes skip advisory jobs on most PRs, so a `success()` record would
  # never fire; `!contains(needs.*.result, 'skipped')` never fires for the same
  # reason. Both were measured never firing in a sibling repository.
  # `!cancelled()` stops the implicit `success()` from being AND-ed in.
  #
  # 🔴 `result == 'success'` IS NOT ENOUGH ON ITS OWN: a host SUCCEEDS with some
  # of its lanes switched off (the release lane runs `core` for `packaging`
  # alone and `starters` for its guards alone). So each core lane also needs its
  # output to be `'true'`, and the lane must be `full`. A
  # lane-limited run never records; and the artifact name ends in `-full`,
  # which is the only name the gate looks up.
  #
  # The advisory hosts are in `needs:` and in the condition, but differently:
  # one that was lane-SKIPPED is fine (the push run re-runs all five against the
  # same tree), one that FAILED or was cancelled blocks the record. The gate
  # only accepts a run whose conclusion is `success`, and a failed advisory job
  # makes the run a failure, so that record could never be used.
  # `tests/guards/ci-lanes-ledger.test.mjs` pins `needs:` to every host and the
  # condition to every host and core lane, as sets: adding either without both
  # fails.
  record-tree:
    name: Record the tested tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - lanes
      - core
      - starters
      - advisory
      - design-system-cross-browser
    if: >-
      ${{ !cancelled()
      && github.event_name == 'pull_request'
      && needs.lanes.result == 'success'
      && needs.lanes.outputs.lane == 'full'
      && needs.core.result == 'success'
      && needs.lanes.outputs.sdk == 'true'
      && needs.lanes.outputs.civitai-sdk == 'true'
      && needs.lanes.outputs.blocks-react == 'true'
      && needs.lanes.outputs.design-system == 'true'
      && needs.lanes.outputs.readme-snippets == 'true'
      && needs.lanes.outputs.examples == 'true'
      && needs.lanes.outputs.packaging == 'true'
      && needs.lanes.outputs.public-types == 'true'
      && needs.lanes.outputs.agent-runner == 'true'
      && needs.starters.result == 'success' && needs.lanes.outputs.starter == 'true'
      && needs.advisory.result != 'failure' && needs.advisory.result != 'cancelled'
      && needs.design-system-cross-browser.result != 'failure' && needs.design-system-cross-browser.result != 'cancelled'
      }}
    steps:
      # The default ref for pull_request is the merge commit every other job
      # tested (`github.sha`), so this is the tree they ran against.
      - uses: actions/checkout@v7

      - id: tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - run: printf '{"tree":"%s","run_id":"%s","commit":"%s","lane":"full"}\n' "${{ steps.tree.outputs.sha }}" "${{ github.run_id }}" "${{ github.sha }}" > tested-tree.json

      - uses: actions/upload-artifact@v7
        with:
          name: ci-tested-tree-${{ steps.tree.outputs.sha }}-full
          path: tested-tree.json
          # The gate ignores a record older than 3 days (MAX_RECORD_AGE_MS).
          retention-days: 3
          if-no-files-found: error
