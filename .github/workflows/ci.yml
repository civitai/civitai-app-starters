name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  sdk:
    name: SDK (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @civitai/app-sdk typecheck
      - run: pnpm --filter @civitai/app-sdk test
      - run: pnpm --filter @civitai/app-sdk build

      # AFTER build, on purpose. The vitest suite imports `src/`; every consumer
      # imports the PUBLISHED specifier (`@civitai/app-sdk/vite`). Those are two
      # different resolutions and a green suite says nothing about the second --
      # a typo in `exports`, a `dist` path never emitted, or a schema file that
      # `files` does not ship all leave the tests green and a scaffold build red.
      # This resolves the node-only subpaths BY PACKAGE NAME and runs
      # `defineBlock` once, which is what proves the vendored schema is reachable
      # from `dist/`.
      - run: pnpm --filter @civitai/app-sdk test:exports

  schema-drift:
    name: Canonical schema drift-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The vendored manifest schema MUST stay byte-identical to the
      # server-published canonical (the single source of truth shared by the
      # platform validator + the `civitai` CLI). Fetch it and diff. A non-200
      # (canonical unreachable) fails the job — the canonical is expected live.
      # Runs the bare script (curl + diff only) — no node/pnpm needed.
      - run: ./scripts/check-canonical-schema.sh

  starter-pins:
    name: Starter pins vs published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Assert every starter/template @civitai/* pin still admits the
      # currently-published npm version (a 0.x caret locks the minor, so a
      # stale pin silently births apps behind the SDK). Pure fetch + compare —
      # no install needed, and it skips gracefully if npm is unreachable.
      - run: node scripts/check-starter-pins.mjs

  # ADVISORY, like the sibling `schema-drift` job: depends on a LIVE external
  # endpoint (the orchestrator's public OpenAPI spec), so it can fail for
  # reasons outside the PR. Do NOT add it to branch protection.
  #
  # The SDK's WORKFLOW_STEP_TYPES / IMAGE_GEN_ENGINES catalogs are hand-written
  # mirrors of that spec's discriminator mappings. `pnpm --filter
  # @civitai/app-sdk test` pins the catalogs to a transcribed fixture offline;
  # this job pins that fixture to the live spec. Only the pair covers "the
  # orchestrator shipped a new step type". Pure fetch + compare — no install.
  orchestrator-catalog-drift:
    name: Orchestrator catalog drift-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: node scripts/check-orchestrator-catalogs.mjs

  civitai-sdk:
    name: '@civitai/sdk (typecheck + test + build)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @civitai/sdk typecheck
      - run: pnpm --filter @civitai/sdk api:check
      - run: pnpm --filter @civitai/sdk check:layering
      - run: pnpm --filter @civitai/sdk check:parity
      - run: pnpm --filter @civitai/sdk check:steps
      - run: pnpm --filter @civitai/sdk test
      - run: pnpm --filter @civitai/sdk build


  blocks-react:
    name: blocks-react (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # blocks-react consumes @civitai/app-sdk, @civitai/theme and
      # @civitai/components via workspace:^ and resolves types from their dist/.
      # Build those deps first so blocks-react isn't typechecking against stale
      # or missing declarations.
      - run: pnpm --filter @civitai/app-sdk build
      - run: pnpm --filter @civitai/theme build
      - run: pnpm --filter @civitai/sdk build
      - run: pnpm --filter @civitai/components build

      - run: pnpm --filter @civitai/blocks-react typecheck
      - run: pnpm --filter @civitai/blocks-react test
      - run: pnpm --filter @civitai/blocks-react build

      # Real-browser (vitest browser mode) perf/layout tests for the dev:live
      # picker overlay — happy-dom can't lay out, decode images, or run
      # IntersectionObserver/PerformanceObserver, so these run in headless
      # Chromium. Install Playwright's bundled Chromium + its OS deps first.
      # (CI uses the bundled binary; NixOS local runs set
      # PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium) instead.)
      #
      # 🔴 timeout-minutes is NOT belt-and-braces here. `--with-deps` shells out
      # to apt-get, and a wedge there is INDISTINGUISHABLE from a slow install:
      # the job just renders "in progress" until GitHub's 6-hour cap. Measured
      # 2026-08-19 on one PR — this exact step ran 22-33s on four branches that
      # morning, then HUNG FOR 2h13m on a commit whose lockfile did not move
      # playwright at all, and a plain re-run of the same commit completed in
      # 3m48s. So the hazard is real, unrelated to any diff, and silent.
      #
      # 15, not 10: the slowest SUCCESSFUL run observed was 3m48s, so this is
      # ~4x headroom against a false red (a timeout that fires on healthy runs
      # trains everyone to click re-run, which is worse than no timeout) while
      # still cutting a wedge from 6h to 15m.
      - run: pnpm --filter @civitai/blocks-react exec playwright install --with-deps chromium
        timeout-minutes: 15
      - run: pnpm --filter @civitai/blocks-react test:browser

  # SELF-CONTAINED design-system job. Everything here builds/typechecks/tests
  # against THIS repo only — no civitai/civitai checkout, no live external
  # dependency — so it is safe to make a REQUIRED branch-protection check
  # (a civitai/civitai outage or theme-file move can never block PRs here).
  # The live-civitai drift guard lives in the separate advisory
  # `design-system-drift-guard` job below. KEEP this job named `design-system`
  # so the required-check setting stays stable.
  design-system:
    name: design-system (theme + components + components-react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build in dependency order: theme (Mantine -> --civitai-* tokens) ->
      # components (CSS referencing those tokens) -> components-react (bindings).
      - run: pnpm --filter @civitai/theme build
      - run: pnpm --filter @civitai/sdk build
      - run: pnpm --filter @civitai/components build
      - run: pnpm --filter @civitai/components-react build

      # @civitai/theme: the SELF-CONTAINED guards only — generation parity
      # (committed artifacts == fresh generation) and the breakpoint px-not-em
      # scale guard. Neither needs a civitai checkout. The live-civitai drift
      # guards are NOT run here; they run in the advisory
      # `design-system-drift-guard` job. `test:self` names those two files.
      - run: pnpm --filter @civitai/theme typecheck
      - run: pnpm --filter @civitai/theme test:self

      - run: pnpm --filter @civitai/components typecheck
      - run: pnpm --filter @civitai/components test

      - run: pnpm --filter @civitai/components-react typecheck
      - run: pnpm --filter @civitai/components-react test

      # HTML-vs-React computed-style parity + axe a11y in real headless Chromium
      # (happy-dom has no layout / getComputedStyle). Bundled Chromium in CI.
      # Same apt/network wedge hazard as the blocks-react job above — see the
      # measurement recorded there. This is the step that actually hung; both
      # sites get the guard, because fixing only the one that bit us leaves the
      # identical bug armed at the other.
      - run: pnpm --filter @civitai/components-react exec playwright install --with-deps chromium
        timeout-minutes: 15
      - run: pnpm --filter @civitai/components-react test:browser

      # The custom elements: real upgrade, ElementInternals and computed styles,
      # including parity against the attribute markup they replace. Chromium is
      # already installed by the step above (one shared Playwright cache).
      - run: pnpm --filter @civitai/components test:browser

  # ADVISORY cross-engine contract. Kept OUT of branch protection because the
  # cost here is the BROWSER INSTALL, not the tests: `playwright install
  # --with-deps` was measured wedging for 2h13m on one commit (2026-08-19),
  # which is why every install step in this file carries a timeout. Three
  # engines triples that exposure, so a wedge or an upstream apt failure must
  # not be able to block a PR. The chromium half of this contract already runs
  # inside the REQUIRED `design-system` job, so nothing is only checked here.
  design-system-cross-browser:
    name: design-system cross-browser contract (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @civitai/theme build
      - run: pnpm --filter @civitai/sdk build
      - run: pnpm --filter @civitai/components build

      - run: pnpm --filter @civitai/components exec playwright install --with-deps chromium firefox webkit
        timeout-minutes: 25

      # Probes the platform features the elements are built on, then the
      # cross-engine surface itself: upgrade, token inheritance across the
      # shadow boundary, form association, `change` escaping, and `::part`.
      - run: pnpm --filter @civitai/components test:contract

  # ADVISORY drift guard — depends on a LIVE external checkout of civitai/civitai
  # (sparse: src/providers + src/utils) to assert the vendored theme.source.ts
  # hasn't drifted from civitai's real Mantine theme, and the vendored px
  # breakpoint scale hasn't drifted from src/utils/breakpoints.json. Because it
  # can fail for reasons outside
  # this PR (civitai/civitai unreachable, or its theme file moved), it is kept
  # ADVISORY — do NOT add it to branch protection. This mirrors the sibling
  # live-dependent `Canonical schema drift-check` job, which is also advisory.
  design-system-drift-guard:
    name: design-system drift guard (vs live civitai/civitai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Check out civitai/civitai's vendored sources (public repo, SPARSE):
      #   src/providers — ThemeProvider.tsx, guarded by theme-drift.test.ts
      #   src/utils     — breakpoints.json, guarded by breakpoint-drift.test.ts
      # so both drift guards RUN in CI instead of skipping. REQUIRE_DRIFT_GUARD=1
      # (below) turns an absent/unreadable source into a FAILURE, so this can't
      # silently regress to a skip — including if a future edit drops a path here.
      - uses: actions/checkout@v7
        with:
          repository: civitai/civitai
          ref: main
          path: .civitai-src
          sparse-checkout: |
            src/providers
            src/utils
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the theme so the drift test resolves against fresh package state.
      - run: pnpm --filter @civitai/theme build

      # The drift guards only. CIVITAI_REPO points at the sparse civitai checkout
      # and REQUIRE_DRIFT_GUARD=1 makes them RUN-OR-FAIL (never a silent skip).
      # `test:drift` names theme-drift.test.ts + breakpoint-drift.test.ts.
      - run: pnpm --filter @civitai/theme test:drift
        env:
          CIVITAI_REPO: ${{ github.workspace }}/.civitai-src
          REQUIRE_DRIFT_GUARD: '1'

  readme-snippets:
    name: README snippets (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The snippet checker resolves documented imports against the packages'
      # BUILT declarations, so build deps first (blocks-react consumes app-sdk,
      # @civitai/theme and @civitai/components).
      - run: pnpm --filter @civitai/app-sdk build
      - run: pnpm --filter @civitai/theme build
      - run: pnpm --filter @civitai/sdk build
      - run: pnpm --filter @civitai/components build
      - run: pnpm --filter @civitai/blocks-react build

      - run: pnpm typecheck:readme

      # Negative controls for the step above. The snippet runner used to shim
      # every TYPE-only identifier to `any`, so it reported PASS for a snippet
      # whose documented type it had never resolved — a green run that was a
      # claim about the shim, not about the doc. This asserts the runner can go
      # RED, and prints what it still does not cover.
      - run: pnpm typecheck:readme:selftest

  starter:
    name: Starter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        starter:
          - next-app
          - sveltekit-app
          - react-pwa
          - svelte-pwa
          - civitai-block-starter
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Unit tests for BOTH release guards (node:test; no install, no network --
      # check-starter-pins' suite runs against a stand-in registry). They live in
      # this REQUIRED matrix job on purpose: it is the only required context that
      # runs before the install, so the guards' own coverage is enforced rather
      # than advisory. Deliberately run in every matrix leg rather than under an
      # `if:` -- a conditional here would silently stop running the moment its
      # matrix entry was renamed.
      # Call the npm script, not a bare `node --test`: the script carries
      # `--test-timeout`, without which a guard that hangs (a removed request
      # timeout falls back to undici's ~300s) burns the job instead of failing.
      - run: pnpm test:guards

      # RELEASE-DEADLOCK GUARD. Runs BEFORE the install so a missing override
      # fails with the actionable message instead of the cryptic
      # ERR_PNPM_OUTDATED_LOCKFILE the deadlock actually surfaces as.
      #
      # The starters pin PUBLISHED caret ranges (not workspace:*) because they
      # are copied out verbatim by `npx tiged` -- see 2a453e6. `changeset
      # version` rewrites those carets to versions that are not published yet,
      # so every first-party @civitai/* package must also be pinned to
      # workspace:* in the root pnpm.overrides, or the Version Packages PR can
      # never install and the release deadlocks. Offline; no install needed.
      # The same guard also blocks re-introducing workspace: into a starter and
      # asserts a floor on how many pins it covers.
      - run: node scripts/check-starter-workspace-overrides.mjs

      - run: pnpm install --frozen-lockfile

      # Starters consume the first-party packages via published caret ranges
      # that the root pnpm.overrides redirects to workspace:* (the block
      # starter additionally consumes @civitai/blocks-react). Building all
      # packages up front so each starter's typecheck sees fresh .d.ts files.
      - run: pnpm -r --filter "./packages/*" build

      - name: Typecheck
        run: pnpm --filter ./starters/${{ matrix.starter }} typecheck

      - name: Build
        # Each starter's env helper bails on missing CIVITAI_CLIENT_ID etc.
        # CI doesn't have real secrets; SKIP_ENV_VALIDATION turns the bailout
        # off so the build verifies code compiles, not that env is wired.
        run: pnpm --filter ./starters/${{ matrix.starter }} build
        env:
          SKIP_ENV_VALIDATION: '1'

      # EXPIRED-SESSION PROBE (next-app only). Next.js forbids cookie writes in a
      # Server Component, and that rule exists only inside a real render — no
      # unit test can reach it. `getSession()` used to refresh in place, so an
      # expired session took the whole page render down with
      # `Cookies can only be modified in a Server Action or Route Handler`, and
      # the browser was never told to drop the dead cookie. Refresh now lives in
      # middleware; this drives a real `next start` over HTTP and asserts BOTH
      # arms — rejected refresh clears the cookie and renders logged-out,
      # accepted refresh re-seals it and renders signed-in.
      #
      # PROBE_SKIP_BUILD reuses the `.next` the Build step above just produced.
      # timeout-minutes for the same reason the playwright steps have one: a
      # wedged child process is indistinguishable from a slow one, and would
      # otherwise burn to GitHub's 6-hour cap.
      - name: Expired-session probe (next-app)
        if: matrix.starter == 'next-app'
        run: pnpm --filter ./starters/next-app probe:expired-session
        env:
          PROBE_SKIP_BUILD: '1'
        timeout-minutes: 5

      # STATIC-SERVING PROBE (the two PWA starters). Their prod entry used to
      # resolve `./dist` against the PROCESS CWD and serve the SPA fallback by
      # fetching ITSELF over TCP. Started from any directory other than the
      # package root — systemd `WorkingDirectory`, a container `WORKDIR`, pm2 —
      # the static middleware missed, so `/index.html` fell into the same
      # catch-all that fetched it, recursing without bound. Measured: 25
      # requests took the process from 20 open descriptors to 92,124, and every
      # one of them timed out, while the server still logged "Listening".
      #
      # The probe starts the built server from a temp directory and asserts a
      # real asset comes back byte-identical, that a concurrent burst does not
      # double the socket count, and that a missing dist/index.html exits
      # non-zero. PROBE_SKIP_BUILD reuses the Build step's output.
      - name: Static-serving probe (PWA starters)
        if: matrix.starter == 'react-pwa' || matrix.starter == 'svelte-pwa'
        run: pnpm --filter ./starters/${{ matrix.starter }} probe:static-serving
        env:
          PROBE_SKIP_BUILD: '1'
        timeout-minutes: 5

      # COOKIE-FLAGS PROBE (the two PWA starters). `production` used to be
      # `NODE_ENV === 'production'`, and NOTHING SETS NODE_ENV: `pnpm start` is
      # `node --env-file=.env dist-server/index.js`. So a correctly deployed,
      # HTTPS-served app took the dev branch — session cookies without `Secure`
      # and no HSTS — while working perfectly, which is why nobody would notice.
      # It now derives from APP_URL's scheme. The probe drives the real OAuth
      # handshake in-process against a stand-in hub and checks BOTH points on
      # the dimension: https -> Secure + HSTS, http -> neither. One point alone
      # is passed by `const production = true`.
      - name: Cookie-flags probe (PWA starters)
        if: matrix.starter == 'react-pwa' || matrix.starter == 'svelte-pwa'
        run: pnpm --filter ./starters/${{ matrix.starter }} probe:cookie-flags
        env:
          PROBE_SKIP_BUILD: '1'
        timeout-minutes: 5

      - name: Lint (if defined)
        run: |
          if pnpm --filter ./starters/${{ matrix.starter }} exec node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)" 2>/dev/null; then
            pnpm --filter ./starters/${{ matrix.starter }} lint
          else
            echo "No lint script for ${{ matrix.starter }} — skipping."
          fi

  # What the TARBALLS contain, as opposed to what the tests import. Every job
  # above resolves `src/` or the workspace link; none of them has ever looked at
  # the artifact npm actually receives, which is how all five packages came to
  # ship 270 sourcemaps that could not resolve a single one of their `sources`
  # (#376). Its own job because it needs the built `dist/` AND shells out to
  # `npm pack --dry-run` per package — deliberately NOT a `tests/guards/` unit
  # test, whose per-test budget a sibling guard already records that call
  # blowing.
  packaging:
    name: Packaging (shipped sourcemaps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The maps only exist after a build; the checker FAILS on an unbuilt tree
      # rather than reporting a vacuous "0 dangling" over an empty scan.
      - run: pnpm -r --filter "./packages/*" build

      # NEGATIVE + POSITIVE control FIRST, so the check below cannot report a
      # reassuring zero from a checker wired to nothing. Ordered like the
      # sibling `readme-snippets` job's selftest, and for the same reason.
      - run: pnpm check:shipped-sourcemaps:selftest

      - run: pnpm check:shipped-sourcemaps

  # What a CONSUMER can NAME, as opposed to what the packages export by
  # accident. Every typecheck job above resolves `src/` or the workspace link
  # and sees every local declaration, so none of them can tell that
  # `responseToResources`'s parameter type had no name on the published surface
  # (#379). The real SCAN gets its own job, and is not a `tests/guards/` unit
  # test, because it needs the installed `typescript` AND a built `dist/` —
  # `pnpm test:guards` runs in the required matrix job BEFORE the install. The
  # checker's own logic IS unit-tested (`tests/guards/
  # check-public-type-closure-patterns.test.mjs`), and that suite is run from
  # inside THIS job for the same reason: it needs the install too.
  public-types:
    name: Public type closure (built .d.ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The checker's OWN unit tests — `exports` subpath-pattern handling, over
      # synthetic trees. They live in `tests/guards/` with every other guard
      # suite, but the required matrix job runs `pnpm test:guards` BEFORE the
      # install and this suite needs the installed `typescript` (same reason
      # this job exists at all), so there it SKIPS. Here it must not: the env
      # flag turns an unresolvable `typescript` into a failure, so the coverage
      # is enforced in the one tier that can see it rather than quietly
      # evaporating in the tier that cannot.
      #
      # Runs BEFORE the build on purpose — it drives the guard over temp-dir
      # fixtures, so a red here is the guard's logic, not the tree's state.
      - run: pnpm test:guards:public-types
        env:
          GUARDS_REQUIRE_INSTALL: '1'

      # The `.d.ts` barrels only exist after a build; the checker FAILS on an
      # unbuilt or half-built tree rather than reporting a vacuous "0 violations"
      # over nothing scanned.
      - run: pnpm -r --filter "./packages/*" build

      # NEGATIVE + POSITIVE control FIRST — a deliberately unexported type that
      # must be reported, and the same fixture exported that must report zero
      # over a non-zero number of walked references. Ordered like the sibling
      # `packaging` and `readme-snippets` jobs, and for the same reason.
      - run: pnpm check:public-types:selftest

      - run: pnpm check:public-types
