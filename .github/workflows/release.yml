name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version + publish packages
    runs-on: ubuntu-latest
    steps:
      # Check out with the SAME non-Actions token the changesets step uses below.
      #
      # `actions/checkout` persists its token as the git credential for the rest
      # of the job, and that credential — NOT the `GITHUB_TOKEN` env var on the
      # changesets step — is what actually pushes `changeset-release/main`. The
      # env var only authenticates the Octokit calls, which is why the Version PR
      # is authored by the PAT owner while every push to its branch was attributed
      # to `github-actions[bot]`.
      #
      # That split is what stalls releases. This repo's Actions approval policy is
      # `first_time_contributors`, and `github-actions[bot]` can never stop being
      # one — so the `synchronize` run triggered by that push parks as
      # `action_required`. Every first-attempt run on `changeset-release/main` with
      # that actor has parked; the only ones that ever executed were manual re-runs.
      # The Version PR is then left without its required checks and reads BLOCKED,
      # with an unclicked approval button as the real cause. (On the 2026-08-12
      # release the parked run also cancelled the healthy PAT-authored `opened` run
      # via `cancel-in-progress`, leaving the branch with nothing but the parked one.)
      #
      # Pushing as the PAT owner (a contributor, not the bot) removes the approval
      # requirement entirely. No policy is weakened: fork PRs still require
      # approval, which on a public repo is the setting worth keeping.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      # Node 24 ships npm >= 11.5.1, the minimum CLI version that supports
      # npm OIDC trusted publishing. Node 20/22 bundle npm 10.x, whose OIDC
      # handshake silently fails -> the registry treats the publish as
      # anonymous and returns `E404 Not Found - PUT .../@civitai%2f<pkg>`
      # (a 404, not 403, to hide package existence). That is exactly the
      # failure seen on run 27824888566.
      # Ref: https://docs.npmjs.com/trusted-publishers
      #   "npm CLI version 11.5.1 or later and Node version 22.14.0 or higher"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Use the npm bundled with Node 24 (>= 11.5.1 — has OIDC trusted-publishing
      # AND a working `sigstore` for provenance). Do NOT `npm install -g npm@latest`:
      # that global reinstall lands an npm whose provenance path fails with
      # `Cannot find module 'sigstore'` (MODULE_NOT_FOUND from libnpmpublish/
      # provenance.js), breaking `changeset publish` (run 29030639528). The bundled
      # npm already satisfies the OIDC minimum, so the reinstall was redundant.
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # Every publishable package must be built so `files: ["dist"]` ships
      # real output. `pnpm release` (root package.json) re-runs this for
      # safety even when invoked locally — both paths must agree.
      - run: pnpm -r --filter "./packages/*" build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          # Open the Version-Packages PR with a NON-Actions token. The org
          # disables "Allow GitHub Actions to create and approve pull requests"
          # (enforced), so the default GITHUB_TOKEN 409s at the create-PR step —
          # which is why the Version PR had to be opened by hand every release.
          # A fine-grained PAT / GitHub App token is NOT subject to that org
          # restriction, so the action can open (and trigger CI on) the PR.
          # Falls back to GITHUB_TOKEN when the secret is absent: publishing still
          # works via OIDC; only the auto-PR-creation needs CHANGESETS_TOKEN.
          # SECRET: a fine-grained PAT (ideally a bot account) scoped to this repo
          # with Contents: write + Pull requests: write.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — npm OIDC trusted publishing handles auth via
          # the id-token permission above. Configure the trust on npmjs.com
          # for every published package: @civitai/app-sdk and
          # @civitai/blocks-react. Each must have a GitHub Actions Trusted
          # Publisher (owner civitai, repo civitai-app-starters, workflow
          # release.yml, environment blank).
          # Provenance is auto-generated by OIDC publishing — no --provenance
          # flag needed.
