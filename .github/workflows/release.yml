name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version + publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Every publishable package must be built so `files: ["dist"]` ships
      # real output. `pnpm release` (root package.json) re-runs this for
      # safety even when invoked locally — both paths must agree.
      - run: pnpm -r --filter "./packages/*" build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — npm OIDC trusted publishing handles auth via
          # the id-token permission above. Configure the trust on npmjs.com
          # for every published package (currently @civitai/app-sdk and
          # @civitai/blocks-react).
