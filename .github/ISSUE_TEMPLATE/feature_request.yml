name: Feature request
description: Suggest an improvement to a starter or the shared SDK.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: please check
        [`AGENTS.md`](../blob/main/AGENTS.md) — we deliberately keep the
        starters minimal, and some popular asks (CLI generator, bundled
        DB, multi-page demo, Redis sessions) are explicit non-goals.

  - type: dropdown
    id: starter
    attributes:
      label: Which starter (or the SDK)?
      options:
        - starters/next-app
        - starters/sveltekit-app
        - starters/react-pwa
        - starters/svelte-pwa
        - packages/civitai-app-sdk
        - All starters / repo-level
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do, and where does the current starter fall short?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Optional. What would you like to see, concretely?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: tenant-model
    attributes:
      label: Tenant model check
      description: The starters use OAuth so the *user's* Buzz pays. Confirm your proposal stays compatible.
      options:
        - label: My proposal keeps OAuth + user-paid Buzz as the tenant model (i.e. doesn't quietly swap in an app-owned API key).
          required: true
